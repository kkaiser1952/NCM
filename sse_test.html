<!DOCTYPE html>
<html>
<head>
    <title>SSE Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .message { margin: 10px 0; padding: 10px; background: #f0f0f0; border-radius: 5px; }
        .error { color: red; }
    </style>
</head>
<body>
    <h1>SSE Test</h1>
    <div id="status">Connecting...</div>
    <div id="events"></div>
    
    <script>
        // Get the net ID from URL parameter or use a default
        const urlParams = new URLSearchParams(window.location.search);
        const netID = urlParams.get('netID') || 14265; // Use your test net ID as default
        
        document.title = `SSE Test - Net ID: ${netID}`;
        
        const eventsDiv = document.getElementById('events');
        const statusDiv = document.getElementById('status');
        
        // Function to add a message to the page
        function addMessage(text, isError = false) {
            const div = document.createElement('div');
            div.textContent = new Date().toLocaleTimeString() + ': ' + text;
            div.className = 'message' + (isError ? ' error' : '');
            eventsDiv.insertBefore(div, eventsDiv.firstChild);
        }
        
        // Create SSE connection
        try {
            statusDiv.textContent = `Connecting to sse_updates.php?netID=${netID}...`;
            
            const source = new EventSource(`sse_updates.php?netID=${netID}`);
            
            // Connection open handler
            source.onopen = function() {
                statusDiv.textContent = 'Connected';
                addMessage('Connection established');
            };
            
            // Connected event handler
            source.addEventListener('connected', function(e) {
                try {
                    const data = JSON.parse(e.data);
                    addMessage(`Connected to net ID: ${data.netID} at ${data.time}`);
                } catch (error) {
                    addMessage(`Error parsing connected event: ${error}`, true);
                    addMessage(`Raw data: ${e.data}`, true);
                }
            });
            
            // Update event handler  
            source.addEventListener('update', function(e) {
                try {
                    const data = JSON.parse(e.data);
                    addMessage(`Update received: Records changed from ${data.previousCount} to ${data.recordCount}`);
                } catch (error) {
                    addMessage(`Error parsing update event: ${error}`, true);
                    addMessage(`Raw data: ${e.data}`, true);
                }
            });
            
            // Error handler
            source.onerror = function(e) {
                statusDiv.textContent = 'Error - connection lost';
                addMessage(`Error: ${e.type}`, true);
                console.error('SSE Error:', e);
            };
        } catch (error) {
            statusDiv.textContent = 'Error creating connection';
            addMessage(`Error creating EventSource: ${error}`, true);
        }
    </script>
</body>
</html>
